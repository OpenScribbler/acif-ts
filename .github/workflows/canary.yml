name: ACIF conformance canary

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      ACIF_SPEC_REPO: ${{ vars.ACIF_SPEC_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run canary
        run: bash scripts/canary.sh
